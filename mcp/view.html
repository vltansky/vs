<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VS artifact</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { font: 14px system-ui, sans-serif; }
    #status { padding: 16px; }
    /* Give inline hosts room to show the artifact; the host may cap the requested size. */
    #vs-artifact-frame { display: none; width: 100%; height: max(720px, 100vh); border: 0; }
  </style>
</head>
<body>
  <div id="status" role="status">Loading artifact…</div>
  <iframe id="vs-artifact-frame" title="VS artifact" sandbox="allow-scripts"></iframe>
  <!-- APP_SCRIPT -->
</body>
</html>
