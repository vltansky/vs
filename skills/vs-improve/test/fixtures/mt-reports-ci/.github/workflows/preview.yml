name: Preview
on:
  pull_request:
    paths: ['packages/reportan-web/**']
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build -w reportan-web
      - run: npx firebase hosting:channel:deploy pr-${{ github.event.number }}
