<!doctype html>
<!--
  VS HTMDX proposal/RFC artifact. Edit only the text inside the primary
  script[type="text/htmdx"] block and the existing title text.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="vs-artifact-format" content="htmdx@2" />
    <meta name="vs-artifact-id" content="[[ARTIFACT_ID]]" />
    <meta name="vs-renderer" content="@wix/htmdx@4" />
    <title>[[TITLE]]</title>
    <script
      src="https://cdn.jsdelivr.net/npm/@wix/htmdx@4/dist/browser.js"
      defer
    ></script>
    <!-- The vs tokens name Figtree but the runtime never loads it; without
         these links every artifact silently falls back to the system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
    />
    <script>
      // Browser copy of the vs catalog. The CLI loads it from
      // assets/definitions.mjs via --definitions; a portable artifact cannot
      // import that file, so the same components, layout, and stylesheet
      // register here. Edit definitions.mjs and re-run
      // assets/sync-artifact-catalog.mjs; test/vs-catalog.static.eval.ts fails
      // when the two copies drift.
      window.addEventListener('htmdx:ready', () => {
// vs-catalog:begin (generated by sync-artifact-catalog.mjs - do not edit)
const vsLayoutCss = `
  /* vs: one column of source-order content, no rail, no hero, no section
     cards. vs-proposal: the same tokens and components under a proposal
     shell - dark hero, sticky contents rail. Scoped to the layouts so every
     other artifact this runtime renders keeps its stock look; the ^= prefix
     match is the sharing seam - it reaches both 'vs' and 'vs-proposal'. */
  /* Corners come from two scales - the shadcn built-ins compile theirs from
     --radius, the runtime chrome reads --md-sys-shape-corner-* - so a tighter
     vs card has to move both. Overriding --radius-lg instead does nothing:
     Tailwind inlines the theme expression, so the utility ends up pointing at
     --radius directly. */
  .htmdx-app[data-htmdx-layout^='vs'] {
    box-sizing: border-box;
    min-height: 100vh;
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    --radius: 4px;
    --md-sys-shape-corner-small: 3px;
    --md-sys-shape-corner-medium: 4px;
    --md-sys-shape-corner-large: 5px;
    --md-sys-shape-corner-extra-large: 5px;
    /* The vs palette: the terminal theme - Ghostty's stock #282C34 surface
       (One Dark lineage) with Claude Code's periwinkle accent carrying links,
       code spans, gauge fills, and the contents-rail numbers. Neutrals are a
       ladder in the same slate hue; the semantic colors (emerald/red/amber in
       the components) follow One Dark's ANSI set. Scoped to the layout. */
    --md-sys-color-primary: #93A4E8;
    --md-sys-color-on-primary: #10182E;
    --md-sys-color-primary-container: #2A3352;
    --md-sys-color-on-primary-container: #C8D2F4;
    --md-sys-color-secondary: #A9B0BD;
    --md-sys-color-on-secondary: #14161B;
    --md-sys-color-secondary-container: #383E4A;
    --md-sys-color-on-secondary-container: #E4E8EF;
    --md-sys-color-tertiary: #A9B0BD;
    --md-sys-color-on-tertiary: #14161B;
    --md-sys-color-tertiary-container: #383E4A;
    --md-sys-color-on-tertiary-container: #E4E8EF;
    --md-sys-color-surface: #282C34;
    --md-sys-color-on-surface: #D7DCE4;
    --md-sys-color-surface-variant: #333845;
    --md-sys-color-on-surface-variant: #A9B0BD;
    --md-sys-color-outline: #6C7484;
    --md-sys-color-outline-variant: #3B414C;
    --md-sys-color-surface-container-lowest: #21252C;
    --md-sys-color-surface-container-low: #2D323B;
    --md-sys-color-surface-container: #31363F;
    --md-sys-color-surface-container-high: #363B45;
    --md-sys-color-surface-container-highest: #3C424D;
    /* One soft shadow per level instead of Material's key + ambient pair: the
       flat surfaces separate with a hairline, so elevation only has to lift a
       floating element off the page. */
    --md-sys-elevation-level0: none;
    --md-sys-elevation-level1: 0 1px 2px rgb(0 0 0 / 40%);
    --md-sys-elevation-level2: 0 2px 6px rgb(0 0 0 / 45%);
    --md-sys-elevation-level3: 0 8px 24px rgb(0 0 0 / 55%);
    --md-sys-state-hover-opacity: 0.08;
    /* The runtime derives these aliases on :root, where custom properties
       compute once and inherit as values, not as var() references - so every
       alias is re-declared here to recompute against the scoped ladder. */
    --htmdx-bg: var(--md-sys-color-surface);
    --htmdx-ink: var(--md-sys-color-on-surface);
    /* Reading text stays full-contrast on the surface; only secondary text
       (notes, captions, chips) takes the muted variant. */
    --htmdx-body: var(--md-sys-color-on-surface);
    --htmdx-soft: var(--md-sys-color-on-surface-variant);
    --htmdx-line: var(--md-sys-color-outline-variant);
    --htmdx-line-strong: var(--md-sys-color-outline);
    --htmdx-panel: var(--md-sys-color-surface-container);
    --htmdx-green: var(--md-sys-color-secondary);
    --htmdx-green-bg: var(--md-sys-color-secondary-container);
    --htmdx-amber: var(--md-sys-color-tertiary);
    --htmdx-amber-bg: var(--md-sys-color-tertiary-container);
    --htmdx-gray: var(--md-sys-color-on-surface-variant);
    --htmdx-gray-light: var(--md-sys-color-outline);
    --htmdx-gray-bg: var(--md-sys-color-surface-variant);
    /* The runtime's syntax palette is fixed light-theme ink on :root, so plain
       code text lands near-black on the dark code panel. Re-pointed at One
       Dark, the same lineage as the surface: unhighlighted text reads as body
       ink, every token color keeps AA contrast on the panel. */
    --htmdx-code-text: var(--md-sys-color-on-surface);
    --htmdx-code-comment: #7F848E;
    --htmdx-code-keyword: #C678DD;
    --htmdx-code-string: #98C379;
    --htmdx-code-number: #D19A66;
    --htmdx-code-function: #61AFEF;
    --htmdx-code-type: #E5C07B;
    --htmdx-code-property: #E06C75;
    --htmdx-code-punctuation: #A9B0BD;
    --htmdx-code-inserted: #98C379;
    --htmdx-code-deleted: #E06C75;
    --primary: var(--md-sys-color-primary);
    --primary-foreground: var(--md-sys-color-on-primary);
    --ring: var(--md-sys-color-primary);
    --accent: var(--md-sys-color-primary-container);
    --accent-foreground: var(--md-sys-color-on-primary-container);
    /* The shadcn utilities (bg-card, text-muted-foreground, border) read
       these names from :root, where the runtime declares light values - the
       scoped re-declarations point them at the dark ladder. */
    --background: var(--md-sys-color-surface);
    --foreground: var(--md-sys-color-on-surface);
    --card: var(--md-sys-color-surface-container-low);
    --card-foreground: var(--md-sys-color-on-surface);
    --muted: var(--md-sys-color-surface-variant);
    --muted-foreground: var(--md-sys-color-on-surface-variant);
    --border: var(--md-sys-color-outline-variant);
    /* Two faces, one job each. The mono is reserved for what is literally in a
       file - identifiers, paths, code, figures - so setting it in mono is a
       claim that the reader can copy the characters verbatim. Everything the
       author wrote in their own words reads in the sans. A single mono page
       erases that distinction and makes prose as dense as a stack trace.
       Geist Mono is ligature-free on purpose: a face that fuses an arrow or a
       not-equals into one glyph misreports the source the artifact quotes. */
    --vs-mono: 'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    /* Code blocks are painted by the runtime off its own token; point it at the
       theme face or fenced code renders in the browser default while every
       other mono on the page is Geist. */
    --htmdx-mono: var(--vs-mono);
    --vs-sans: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    font-family: var(--vs-sans);
    --vs-hand: 'Excalifont', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
    /* Hand-drawn outlines: uneven four-corner radii (slash syntax offsets each
       corner's horizontal and vertical curve) so no card edge repeats. Two
       scales: cards wobble gently, pills keep the classic sketch-button arc. */
    --vs-sketch-card: 14px 5px 13px 6px / 6px 12px 5px 15px;
    --vs-sketch-pill: 255px 15px 225px 15px / 15px 225px 15px 255px;
    /* Series palette: the One Dark terminal accents in fixed order, so
       charts, mocks, and hand-drawn SVGs pick colors by position instead of
       hand-mixing hexes. 1 is the theme accent; pair every color with a
       label or shape - meaning never rides on color alone. */
    --vs-series-1: #93A4E8;
    --vs-series-2: #98C379;
    --vs-series-3: #E5C07B;
    --vs-series-4: #E06C75;
    --vs-series-5: #56B6C2;
    --vs-series-6: #C678DD;
  }
  /* Every face here is fetched from the CDN, never assumed installed - the
     artifact is a single file that has to look the same on a reader's machine
     as it did on the author's. Latin subsets, and one @font-face per weight
     the theme actually asks for: a weight with no face is silently remapped to
     a neighbour, so dropping one here quietly flattens the type scale.

     The coding face. */
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-400-italic.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }
  /* The body face. No italic is published for it, so emphasis is synthesised
     by the browser - keep emphasis carried by weight or wording where it has
     to be exact. */
  @font-face {
    font-family: 'Space Grotesk';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/files/space-grotesk-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/files/space-grotesk-latin-500-normal.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/files/space-grotesk-latin-600-normal.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/files/space-grotesk-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  /* Excalidraw's own face. Latin subset only; other scripts fall through to
     the system hand fonts in --vs-hand. It stays the voice of the hand-drawn
     diagrams. */
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/prod/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-style: normal;
    font-display: swap;
  }
  /* Overscroll past the app container shows the document canvas - paint it
     the same dark surface so the page has no white edges. The 17px root em
     scales every rem-sized token up one notch for reading comfort. */
  html:has(.htmdx-app[data-htmdx-layout^='vs']) { background: #282C34; font-size: 17px; }
  /* Tailwind's *-700/*-50 semantic pairs are tuned for a white surface; on
     dark the text tones lighten and the wash backgrounds deepen so the
     emerald/red/amber meanings survive the flip. */
  /* Tailwind's bare border/divide utilities default to currentColor - on the
     dark surface that is the near-white text color, so every card edge glows.
     Pin them to the hairline token instead. */
  .htmdx-app[data-htmdx-layout^='vs'] .border,
  .htmdx-app[data-htmdx-layout^='vs'] :is(.divide-y, .divide-x) > * {
    border-color: var(--md-sys-color-outline-variant);
  }
  /* Sketch pass: the whole theme follows the hand-drawn mermaid look. Cards
     and chips get wobbly outlines; dots, gauge tracks, and figure markers are
     excluded - a wobbly 8px circle reads as a rendering bug, not a sketch.
     The px-2 guard limits the pill arc to text chips, keeping progress-bar
     fills and timeline dots perfectly round. */
  .htmdx-app[data-htmdx-layout^='vs'] [data-htmdx-component] .rounded-lg {
    border-radius: var(--vs-sketch-card);
  }
  .htmdx-app[data-htmdx-layout^='vs'] [class*='px-2'].rounded-full {
    border-radius: var(--vs-sketch-pill);
    letter-spacing: 0.02em;
  }
  /* Sources ships each entry as one nowrap pill, so an entry naming several
     paths widens the whole document instead of wrapping - the flex row only
     wraps between pills, never inside one. Cap the pill at the column and let
     it wrap its own contents; without this any long source line breaks the
     page width. */
  .htmdx-app[data-htmdx-layout^='vs'] [data-htmdx-component='Sources'] .whitespace-nowrap {
    max-width: 100%;
    white-space: normal;
    flex-wrap: wrap;
    align-items: baseline;
  }
  .htmdx-app[data-htmdx-layout^='vs'] .text-emerald-700 { color: #98C379; }
  /* One Dark's own red (#E06C75) measures 4.03:1 on the card and 3.46:1 on its
     12% wash - under AA for body text. Lightened just enough to clear both
     (5.77 / 4.66) while staying the same red. */
  .htmdx-app[data-htmdx-layout^='vs'] .text-red-700 { color: #F0949B; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-amber-700 { color: #E5C07B; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-blue-700 { color: #93A4E8; }
  /* Washes are translucent tints of their own accent, not hand-mixed dark
     hexes: they stay in hue with the text on any container they land on. */
  .htmdx-app[data-htmdx-layout^='vs'] .bg-emerald-50 { background-color: rgb(152 195 121 / 12%); }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-red-50 { background-color: rgb(240 148 155 / 12%); }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-amber-50 { background-color: rgb(229 192 123 / 12%); }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-blue-50 { background-color: rgb(147 164 232 / 12%); }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-violet-50 { background-color: rgb(198 120 221 / 12%); }
  .htmdx-app[data-htmdx-layout^='vs'] .text-violet-700 { color: #C678DD; }
  /* The runtime pairs every wash with a dark: variant, but the document never
     enters dark mode - the vs palette is a scoped repaint, not a theme switch -
     so the light wash is what lands. Column tints (DecisionMatrix's chosen
     column) use the /60 opacity form of the same class, and a full column
     carries more area than a chip, so it tints lighter. Matched as attributes,
     not escaped class selectors: the sync script escapes backslashes on its way
     into the template shells, and the drift test compares raw text. */
  .htmdx-app[data-htmdx-layout^='vs'] [class~='bg-emerald-50/60'] { background-color: rgb(152 195 121 / 8%); }
  .htmdx-app[data-htmdx-layout^='vs'] [class~='bg-red-50/60'] { background-color: rgb(240 148 155 / 8%); }
  .htmdx-app[data-htmdx-layout^='vs'] [class~='bg-amber-50/60'] { background-color: rgb(229 192 123 / 8%); }
  .htmdx-app[data-htmdx-layout^='vs'] [class~='bg-blue-50/60'] { background-color: rgb(147 164 232 / 8%); }
  .htmdx-app[data-htmdx-layout^='vs'] [class~='bg-violet-50/60'] { background-color: rgb(198 120 221 / 8%); }
  /* Solid severity chips (IntentList's BLOCKER banner, Gauge's over-budget
     fill) ship raw Tailwind -500 fills with white ink - white on amber-500
     measures 2.15:1. Repainted to the vs tones and flipped to the layout's
     near-black ink, the lightest pair still clears 6:1. */
  .htmdx-app[data-htmdx-layout^='vs'] .bg-emerald-500 { background-color: #98C379; }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-green-500 { background-color: #98C379; }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-amber-500 { background-color: #E5C07B; }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-red-500 { background-color: #F0949B; }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-blue-500 { background-color: #93A4E8; }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-violet-500 { background-color: #C678DD; }
  .htmdx-app[data-htmdx-layout^='vs'] .bg-gray-400 { background-color: #A9B0BD; }
  .htmdx-app[data-htmdx-layout^='vs'] :is(.bg-emerald-500, .bg-green-500, .bg-amber-500, .bg-red-500, .bg-blue-500, .bg-violet-500, .bg-gray-400).text-white,
  .htmdx-app[data-htmdx-layout^='vs'] :is(.bg-emerald-500, .bg-green-500, .bg-amber-500, .bg-red-500, .bg-blue-500, .bg-violet-500, .bg-gray-400) .text-white {
    color: var(--md-sys-color-on-secondary);
  }
  .htmdx-app[data-htmdx-layout^='vs'] .text-emerald-500 { color: #98C379; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-green-500 { color: #98C379; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-amber-500 { color: #E5C07B; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-red-500 { color: #F0949B; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-blue-500 { color: #93A4E8; }
  .htmdx-app[data-htmdx-layout^='vs'] .text-violet-500 { color: #C678DD; }
  /* Outline chips pair a -300 border with a dark: variant that never fires
     here, so a pastel hairline lands on the dark card. Same tones at 45%. */
  .htmdx-app[data-htmdx-layout^='vs'] :is(.border-emerald-300, .border-green-300) { border-color: rgb(152 195 121 / 45%); }
  .htmdx-app[data-htmdx-layout^='vs'] .border-amber-300 { border-color: rgb(229 192 123 / 45%); }
  .htmdx-app[data-htmdx-layout^='vs'] .border-red-300 { border-color: rgb(240 148 155 / 45%); }
  .htmdx-app[data-htmdx-layout^='vs'] .border-blue-300 { border-color: rgb(147 164 232 / 45%); }
  .htmdx-app[data-htmdx-layout^='vs'] .border-violet-300 { border-color: rgb(198 120 221 / 45%); }
  .htmdx-app[data-htmdx-layout^='vs'] .border-gray-300 { border-color: var(--md-sys-color-outline-variant); }
  .htmdx-app[data-htmdx-layout='vs'] { padding: 44px 24px 64px; }
  .htmdx-app[data-htmdx-layout='vs'] > * {
    width: 100%;
    max-width: 60rem;
    margin-left: auto;
    margin-right: auto;
  }
  /* The column width above is for blocks. An inline-level child - a bare
     <Badge>, a link, a lone image - inherited it and rendered as a full-width
     bar, which is what a status chip repeated down a page looked like before
     this rule. Inline boxes size to their content. */
  .htmdx-app[data-htmdx-layout='vs'] > :is(span, a, code, em, strong, small, label, img) {
    width: auto;
  }
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > .htmdx-component {
    margin-top: 20px;
    margin-bottom: 20px;
  }
  /* Text and a single figure share one measure so the left edge never breaks;
     only genuinely wide media (a Compare pair, a table) uses the full canvas. */
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > div > :is(p, ul, ol, blockquote, h1, h3, h4, h5, h6),
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > div .htmdx-image,
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > div > svg,
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > div .htmdx-code-figure,
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > div .htmdx-mermaid {
    max-width: 40rem;
  }
  :is(.htmdx-app[data-htmdx-layout='vs'], .vs-p-main) > div .htmdx-mermaid svg { margin: 0; }
  /* The runtime initializes mermaid with a fixed config (no theme hook), so
     dark mode is the Catppuccin Mocha palette ported as CSS over the rendered
     SVG. Mermaid injects id-prefixed styles inside the SVG, hence !important.
     Screen-scoped: print keeps mermaid's stock light theme on white paper.
     Diagrams opting into look: handDrawn draw shapes as rough.js paths inside
     g.basic.label-container; those color themselves via the init directive's
     themeVariables, so the shape override skips them or it repaints the
     sketch hatching into an unreadable smear. */
  .htmdx-app[data-htmdx-layout^='vs'] .htmdx-mermaid {
    background: var(--md-sys-color-surface-container-lowest);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--vs-sketch-card);
    /* Extra bottom padding is the hint's lane. The hint is absolutely placed
       over the panel, so without reserved space it lands on whatever the
       diagram's last row draws there - on a flowchart that is the terminal
       node, the one the reader most needs to finish the path. */
    padding: 16px 16px 34px;
    /* Pan/zoom canvas: the factory binds panzoom to the svg, so the panel
       clips the transformed diagram instead of growing the page. */
    overflow: hidden;
    position: relative;
  }
  @media screen {
    /* A wide diagram fits to width, so its panel can be a short letterbox;
       the native resize handle lets the reader pull the canvas taller. */

    if (!Number.isFinite(from) || !Number.isFinite(to) || from === 0) return undefined;
    const change = ((to - from) / Math.abs(from)) * 100;
    const rounded = Math.abs(change) >= 10 ? Math.round(change) : Math.round(change * 10) / 10;
    return (rounded > 0 ? '+' : '') + rounded + '%';
  };
  const DELTA_ARROW = /\s*(?:→|->)\s*/;
  const Delta = ({ body = '' }) =>
    wrap(
      'Delta',
      h(
        'div',
        { className: 'grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-3' },
        rows(body).map((row, index) => {
          const { label, value } = labelValue(row);
          const [before, after] = value.split(DELTA_ARROW);
          if (!after) {
            return h('div', { key: index, className: 'rounded-lg border bg-card px-4 py-3 text-sm' }, plain(row));
          }
          const { kind, rest } = valence(label);
          const percent = changePercent(before, after);
          return h(
            'div',
            { key: index, className: 'rounded-lg border bg-card px-4 py-3' },
            h('div', { className: 'text-xs text-muted-foreground' }, plain(rest)),
            h(
              'div',
              { className: 'mt-1 flex flex-wrap items-baseline gap-2' },
              h('span', { className: 'text-sm text-muted-foreground line-through' }, plain(before)),
              h('span', { 'aria-hidden': 'true', className: 'text-muted-foreground' }, '→'),
              h('span', { className: 'text-2xl font-medium text-card-foreground' }, plain(after)),
              percent
                ? h(
                    'span',
                    {
                      className:
                        'rounded px-1.5 py-0.5 text-xs font-semibold ' +
                        (kind ? VALENCE_CLASS[kind] : 'bg-muted text-muted-foreground'),
                    },
                    percent,
                  )
                : null,
            ),
          );
        }),
      ),
    );

  const GAUGE_RATIO = /^(\d+(?:[\d,]*\d)?(?:\.\d+)?)\s*\/\s*(\d+(?:[\d,]*\d)?(?:\.\d+)?)\s*(.*)$/;
  const Gauge = ({ body = '' }) =>
    wrap(
      'Gauge',
      h(
        'div',
        { className: 'flex flex-col gap-4 rounded-lg border bg-card px-4 py-4' },
        rows(body).map((row, index) => {
          const { label, value } = labelValue(row);
          const match = value.match(GAUGE_RATIO);
          const used = match && Number(match[1].replaceAll(',', ''));
          const limit = match && Number(match[2].replaceAll(',', ''));
          if (!match || !Number.isFinite(used) || !Number.isFinite(limit) || limit <= 0) {
            return h('div', { key: index, className: 'text-sm' }, plain(row));
          }
          const percent = (used / limit) * 100;
          const rounded = Math.round(percent);
          const fill =
            rounded > 100 ? 'bg-red-500' : rounded >= 90 ? 'bg-amber-500' : 'bg-[var(--md-sys-color-primary)]';
          const unit = match[3].trim();
          return h(
            'div',
            { key: index },
            h(
              'div',
              { className: 'flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1' },
              h('span', { className: 'text-sm text-card-foreground' }, plain(label)),
              h(
                'span',
                { className: 'text-xs tabular-nums text-muted-foreground' },
                used.toLocaleString('en-US') +
                  ' / ' +
                  limit.toLocaleString('en-US') +
                  (unit ? ' ' + unit : '') +
                  ' · ' +
                  rounded +
                  '%',
              ),
            ),
            h(
              'div',
              { 'aria-hidden': 'true', className: 'mt-1.5 h-2 w-full overflow-hidden rounded-full bg-muted' },
              h('div', {
                className: 'h-full rounded-full ' + fill,
                style: { width: Math.min(100, percent) + '%' },
              }),
            ),
          );
        }),
      ),
    );

  // A bar answers "how full"; it cannot answer "how many". At small shares the
  // fill is a few pixels and the reader takes it for a UI element rather than a
  // measurement, so 5% slides past. Discrete cells make the share countable:
  // reduce the ratio to its lowest terms and draw that many cells, and 5/100
  // becomes 1 lit cell in 20 - a quantity the eye can verify without the label.
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  // Past ~50 cells counting fails and the row is a bar again, so an awkward
  // denominator is approximated to twentieths - the coarsest grid that still
  // resolves a single percent-scale share.
  const cellCount = (used, limit) => {
    const divisor = gcd(Math.round(used), Math.round(limit)) || 1;
    const parts = Math.round(limit) / divisor;
    if (parts >= 2 && parts <= 50) return { cells: parts, lit: Math.round(used) / divisor };
    return { cells: 20, lit: Math.round((used / limit) * 20) };
  };
  const Share = ({ body = '' }) =>
    wrap(
      'Share',
      h(
        'div',
        { className: 'flex flex-col gap-4 rounded-lg border bg-card px-4 py-4' },
        rows(body).map((row, index) => {
          const { label, value } = labelValue(row);
          const match = value.match(GAUGE_RATIO);
          const used = match && Number(match[1].replaceAll(',', ''));
          const limit = match && Number(match[2].replaceAll(',', ''));
          if (!match || !Number.isFinite(used) || !Number.isFinite(limit) || limit <= 0 || used > limit) {
            return h('div', { key: index, className: 'text-sm' }, plain(row));
          }
          const { cells, lit } = cellCount(used, limit);
          const unit = match[3].trim();
          return h(
            'div',
            { key: index },
            h(
              'div',
              { className: 'flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1' },
              h('span', { className: 'text-sm text-card-foreground' }, plain(label)),
              h(
                'span',
                { className: 'text-xs tabular-nums text-muted-foreground' },
                used.toLocaleString('en-US') + ' of ' + limit.toLocaleString('en-US') + (unit ? ' ' + unit : ''),
              ),
            ),
            h(
              'div',
              { 'aria-hidden': 'true', className: 'vs-share-cells mt-2' },
              Array.from({ length: cells }, (_cell, i) =>
                h('span', { key: i, className: 'vs-share-cell', 'data-lit': i < lit ? 'true' : undefined }),
              ),
            ),
          );
        }),
      ),
    );

  // Segments split on the same middot the metric captions use, so an option
  // reads as one line of prose in the source and as paired columns on the page.
  const feature = (item) => {
    const match = item.match(/^\*\*([^*]+)\*\*:?\s*(.*)$/);
    return match ? { title: match[1].replace(/:$/, ''), text: match[2] } : { text: item };
  };
  const SEGMENT_CLASS = {
    gain: 'text-emerald-700',
    cost: 'text-red-700',
    plain: 'text-muted-foreground',
  };
  const SEGMENT_GLYPH = { gain: '+', cost: '−', plain: '' };
  const segments = (text) =>
    text
      .split(/\s+·\s+/)
      .map((part) => part.trim())
      .filter(Boolean)
      .map((part) => {
        if (part.startsWith('+')) return { kind: 'gain', text: part.slice(1).trim() };
        if (part.startsWith('−') || part.startsWith('-')) {
          return { kind: 'cost', text: part.slice(1).trim() };
        }
        return { kind: 'plain', text: part };
      });
  const Tradeoff = ({ body = '' }) =>
    wrap(
      'Tradeoff',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const { title, text } = feature(row);
          return h(
            'div',
            { key: index, className: 'px-4 py-3' },
            title ? h('div', { className: 'text-sm font-semibold text-card-foreground' }, plain(title)) : null,
            h(
              'div',
              { className: 'mt-1 flex flex-wrap gap-x-5 gap-y-1 text-sm' },
              segments(text).map((segment, segmentIndex) =>
                h(
                  'span',
                  { key: segmentIndex, className: SEGMENT_CLASS[segment.kind] },
                  SEGMENT_GLYPH[segment.kind]
                    ? h('span', { 'aria-hidden': 'true', className: 'mr-1 font-medium' }, SEGMENT_GLYPH[segment.kind])
                    : null,
                  plain(segment.text),
                ),
              ),
            ),
          );
        }),
      ),
    );

  const STATUS_TONE = {
    Draft: 'bg-muted text-muted-foreground',
    Proposed: 'bg-blue-50 text-blue-700',
    Accepted: 'bg-emerald-50 text-emerald-700',
    Rejected: 'bg-red-50 text-red-700',
    Superseded: 'bg-amber-50 text-amber-700',
  };
  const Verdict = ({ body = '', status = 'Proposed' }) =>
    wrap(
      'Verdict',
      h(
        'div',
        { className: 'rounded-lg border bg-card px-4 py-4' },
        h(
          'span',
          {
            className:
              'inline-flex w-fit items-center gap-1 rounded-full border border-transparent px-2.5 py-0.5 text-xs font-semibold tracking-wide whitespace-nowrap ' +
              (STATUS_TONE[status] || STATUS_TONE.Draft),
          },
          status,
        ),
        h(
          'ul',
          { className: 'mt-3 flex flex-col gap-1.5', style: { listStyle: 'none', margin: '12px 0 0', padding: 0 } },
          // MADR's consequence tri-state: a leading + or − marks a point as a
          // good or bad consequence, unmarked stays neutral - the same
          // valence grammar <Delta> and <Tradeoff> already use.
          rows(body).map((item, index) => {
            const { kind, rest } = valence(item);
            return h(
              'li',
              { key: index, className: 'flex gap-2.5 text-sm text-card-foreground' },
              h(
                'span',
                {
                  'aria-hidden': 'true',
                  className: kind ? 'font-medium ' + (kind === 'gain' ? 'text-emerald-700' : 'text-red-700') : 'text-muted-foreground',
                  // The em dash is wider than +/−; a fixed centered column
                  // keeps every row's text at the same left edge.
                  style: { width: '1.25rem', textAlign: 'center', flexShrink: 0 },
                },
                // Neutral is a middot, not a dash: the display pass rewrites
                // em dashes to hyphens, which would collide with the cost −.
                kind === 'gain' ? '+' : kind === 'cost' ? '−' : '·',
              ),
              h('span', null, plain(rest)),
            );
          }),
        ),
      ),
    );

  // A [done]/[active]/[next] suffix on the stage label marks rollout progress;
  // the number gives way to a check so a finished stage reads at a glance.
  const FLOW_STAGE_STATUS = /^(.*?)\s*\[(done|active|next)\]$/i;
  const Flow = ({ body = '' }) =>
    wrap(
      'Flow',
      h(
        'div',
        { className: 'vs-flow' },
        rows(body).flatMap((row, index) => {
          const { label, value } = labelValue(row);
          const statusMatch = label.match(FLOW_STAGE_STATUS);
          const name = statusMatch ? statusMatch[1] : label;
          const status = statusMatch ? statusMatch[2].toLowerCase() : undefined;
          const stage = h(
            'div',
            {
              key: 'stage' + index,
              className: 'vs-flow-stage rounded-lg border bg-card px-4 py-3',
              'data-status': status,
            },
            h(
              'div',
              { className: 'font-mono text-xs font-bold tracking-widest text-card-foreground' },
              (status === 'done' ? '✓' : index + 1) + ' · ' + plain(name).toUpperCase(),
            ),
            value ? h('div', { className: 'mt-1 text-sm text-muted-foreground' }, plain(value)) : null,
          );
          return index
            ? [h('span', { key: 'arrow' + index, 'aria-hidden': 'true', className: 'vs-flow-arrow' }, '→'), stage]
            : [stage];
        }),
      ),
    );

  const FIGURE_MARKER = /^@(\d+(?:\.\d+)?),(\d+(?:\.\d+)?)\s+(.*)$/;
  const Figure = ({ body = '', src = '', caption = '', width = 'full' }) => {
    const notes = rows(body).map((row) => {
      const match = row.match(FIGURE_MARKER);
      return match ? { x: Number(match[1]), y: Number(match[2]), text: match[3] } : { text: row };
    });
    const size = width === 'half' ? 'half' : 'full';
    return wrap(
      'Figure',
      h(
        'figure',
        { className: 'vs-figure vs-figure--' + size },
        h(
          'div',
          { className: 'vs-figure-plate' },
          h(
            'div',
            { className: 'vs-figure-canvas' },
            src ? h('img', { src, alt: plain(caption) || 'figure', className: 'htmdx-image' }) : null,
            notes.map((note, index) =>
              note.x == null
                ? null
                : h(
                    'span',
                    { key: index, className: 'vs-figure-marker', style: { left: note.x + '%', top: note.y + '%' } },
                    String(index + 1),
                  ),
            ),
          ),
        ),
        caption
          ? h('figcaption', { className: 'vs-figure-caption text-sm italic text-muted-foreground' }, plain(caption))
          : null,
        notes.length
          ? h(
              'ol',
              { className: 'vs-figure-legend' },
              notes.map((note, index) =>
                h(
                  'li',
                  { key: index, className: 'text-sm' },
                  h('span', { className: 'vs-figure-num' }, String(index + 1)),
                  h('span', null, plain(note.text)),
                ),
              ),
            )
          : null,
      ),
    );
  };

  // Catalog is the shape a survey keeps producing and the catalog had no home
  // for: N items, each with a verdict and the same few labeled fields. Written
  // as prose it becomes one bolded run-on per item, which is how a page of
  // twenty features turns into a wall of text no reader can skim.
  const CATALOG_RECORD = /^\*\*(.+?)\*\*\s*(?:\[([^\]]*)\])?\s*$/;
  const CATALOG_TONE = {
    good: 'bg-emerald-50 text-emerald-700',
    bad: 'bg-red-50 text-red-700',
    wait: 'bg-amber-50 text-amber-700',
  };
  // The chip's color is a claim about the verdict, so it is earned by an
  // explicit marker or a listed word - never guessed from arbitrary text.
  const CATALOG_WORDS = {
    good: ['adopt', 'ship', 'keep', 'done', 'yes', 'chosen', 'must', 'extend', 'add'],
    bad: ['no', 'not', "won't", 'wont', 'skip', 'drop', 'reject', 'rejected', 'blocked', 'never'],
    wait: ['later', 'next', 'maybe', 'pilot', 'explore', 'evaluate', 'selective', 'partial', 'defer', 'deferred', 'conditional'],
  };
  const catalogTone = (status) => {
    const trimmed = status.trim();
    if (trimmed.startsWith('+')) return 'good';
    if (trimmed.startsWith('−') || trimmed.startsWith('-')) return 'bad';
    if (trimmed.startsWith('~')) return 'wait';
    const first = trimmed.toLowerCase().split(/[\s-]+/)[0];
    for (const tone of ['good', 'bad', 'wait']) {
      if (CATALOG_WORDS[tone].includes(first)) return tone;
    }
    return null;
  };
  const Catalog = ({ body = '' }) => {
    const records = [];
    for (const row of rows(body)) {
      const head = row.match(CATALOG_RECORD);
      if (head) {
        records.push({ name: head[1], status: (head[2] || '').trim(), image: null, fields: [] });
        continue;
      }
      // A field row before the first record has no owner; dropping it is
      // better than inventing a record the author did not write.
      if (!records.length) continue;
      const record = records[records.length - 1];
      const picture = row.match(MARKDOWN_IMAGE);
      if (picture) {
        record.image = { alt: picture[1], src: picture[2] };
        continue;
      }
      const { label, value } = labelValue(row);
      record.fields.push(value ? { label, value } : { label: '', value: label });
    }
    // One key column for the whole block: sized from the longest label anywhere
    // in it, so a record whose labels are short does not park its values left of
    // its neighbour's. Labels set in the sans, where ch is the width of a zero
    // rather than of every glyph, so the two-character slack absorbs the error.
    let widest = 0;
    for (const record of records) {
      for (const field of record.fields) widest = Math.max(widest, field.label.length);
    }
    const keyStyle = widest ? { '--vs-catalog-key': widest + 2 + 'ch' } : undefined;
    return wrap(
      'Catalog',
      h(
        'div',
        { className: 'flex flex-col', style: keyStyle },
        records.map((record, index) =>
          h(
            'div',
            { key: index, className: 'vs-catalog-record' },
            h(
              'div',
              { className: 'vs-catalog-name' },
              h(
                'div',
                { className: 'flex flex-wrap items-baseline gap-2' },
                h('span', { className: 'text-sm font-semibold text-card-foreground' }, inline(record.name)),
                record.status
                  ? h(
                      'span',
                      {
                        className:
                          'whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-semibold ' +
                          (CATALOG_TONE[catalogTone(record.status)] || 'bg-muted text-muted-foreground'),
                      },
                      record.status.replace(/^[+−~-]\s*/, ''),
                    )
                  : null,
              ),
              record.image
                ? h('img', {
                    src: record.image.src,
                    alt: record.image.alt,
                    className: 'htmdx-image vs-catalog-thumb',
                  })
                : null,
            ),
            record.fields.length
              ? h(
                  'dl',
                  { className: 'vs-catalog-fields' },
                  record.fields.flatMap((field, position) =>
                    field.label
                      ? [
                          h('dt', { key: 'k' + position, className: 'text-xs text-muted-foreground' }, field.label),
                          h(
                            'dd',
                            { key: 'v' + position, className: 'text-sm text-card-foreground' },
                            inline(field.value),
                          ),
                        ]
                      : [
                          h(
                            'dd',
                            {
                              key: 'v' + position,
                              className: 'vs-catalog-note text-sm text-muted-foreground',
                            },
                            inline(field.value),
                          ),
                        ],
                  ),
                )
              : null,
          ),
        ),
      ),
    );
  };

  // Gallery exists because a set of screenshots is not a sequence of figures:
  // captured at six sizes they render at six widths, and the page loses its
  // rhythm. One box size for every tile is the whole component.
  const Gallery = ({ body = '' }) =>
    wrap(
      'Gallery',
      h(
        'div',
        { className: 'grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-3' },
        rows(body).map((row, index) => {
          const picture = row.match(MARKDOWN_IMAGE);
          if (!picture) return h('div', { key: index, className: 'text-sm' }, plain(row));
          const caption = (picture[3] || picture[1]).trim();
          return h(
            'figure',
            { key: index, className: 'vs-gallery-tile' },
            h('img', { src: picture[2], alt: picture[1] || caption, className: 'htmdx-image vs-gallery-image' }),
            caption ? h('figcaption', { className: 'text-sm text-muted-foreground' }, caption) : null,
          );
        }),
      ),
    );

  // Bars compares magnitudes with no ceiling: every bar is scaled to the
  // largest value in the set, so it answers "which is bigger and by how much",
  // not "how close to a limit" - that is <Gauge>'s question.
  const firstNumber = (text) => {
    const match = String(text).match(/-?\d+(?:[\d,]*\d)?(?:\.\d+)?/);
    return match ? Number(match[0].replaceAll(',', '')) : NaN;
  };
  const Bars = ({ body = '' }) => {
    const parsed = rows(body).map((row) => {
      const { label, value } = labelValue(row);
      return { label, value, numeric: firstNumber(value) };
    });
    const max = Math.max(0, ...parsed.map((row) => (Number.isFinite(row.numeric) ? Math.abs(row.numeric) : 0)));
    return wrap(
      'Bars',
      h(
        'div',
        { className: 'flex flex-col gap-3 rounded-lg border bg-card px-4 py-4' },
        parsed.map((row, index) => {
          if (!Number.isFinite(row.numeric) || max <= 0) {
            return h('div', { key: index, className: 'text-sm' }, plain(row.label + (row.value ? ': ' + row.value : '')));
          }
          return h(
            'div',
            { key: index },
            h(
              'div',
              { className: 'flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1' },
              h('span', { className: 'text-sm text-card-foreground' }, plain(row.label)),
              h('span', { className: 'text-xs tabular-nums text-muted-foreground' }, plain(row.value)),
            ),
            h(
              'div',
              { 'aria-hidden': 'true', className: 'mt-1.5 h-2 w-full overflow-hidden rounded-full bg-muted' },
              h('div', {
                className: 'h-full rounded-full bg-[var(--md-sys-color-primary)]',
                style: { width: (Math.abs(row.numeric) / max) * 100 + '%' },
              }),
            ),
          );
        }),
      ),
    );
  };

  // Trend draws the series itself: an inline SVG so the artifact stays
  // portable - no chart library, no canvas. Points scale to the min/max of
  // the set; with fewer than two numeric rows there is no line to draw, so
  // the rows render as text instead of an axis with one dot.
  const Trend = ({ body = '', caption = '' }) => {
    const points = rows(body)
      .map((row) => {
        const { label, value } = labelValue(row);
        return { label, value, numeric: firstNumber(value) };
      })
      .filter((point) => Number.isFinite(point.numeric));
    if (points.length < 2) {
      return wrap('Trend', h('div', { className: 'rounded-lg border bg-card px-4 py-3 text-sm' }, plain(body)));
    }
    const WIDTH = 560;
    const HEIGHT = 120;
    const PAD = 8;
    const min = Math.min(...points.map((point) => point.numeric));
    const max = Math.max(...points.map((point) => point.numeric));
    const span = max - min || 1;
    const px = (index) => PAD + (index * (WIDTH - 2 * PAD)) / (points.length - 1);
    const py = (value) => HEIGHT - PAD - ((value - min) * (HEIGHT - 2 * PAD)) / span;
    const line = points
      .map((point, index) => (index ? 'L' : 'M') + px(index).toFixed(1) + ' ' + py(point.numeric).toFixed(1))
      .join(' ');
    const area =
      line + ' L' + px(points.length - 1).toFixed(1) + ' ' + (HEIGHT - PAD) + ' L' + PAD + ' ' + (HEIGHT - PAD) + ' Z';
    return wrap(
      'Trend',
      h(
        'figure',
        { className: 'vs-trend rounded-lg border bg-card px-4 py-4' },
        h(
          'svg',
          { viewBox: '0 0 ' + WIDTH + ' ' + HEIGHT, role: 'img', 'aria-label': plain(caption) || 'trend chart' },
          h('path', { d: area, fill: 'currentColor', opacity: 0.08 }),
          h('path', { d: line, fill: 'none', stroke: 'currentColor', strokeWidth: 2 }),
          points.map((point, index) =>
            h(
              'circle',
              { key: index, cx: px(index), cy: py(point.numeric), r: 3.5, fill: 'currentColor' },
              h('title', null, plain(point.label) + ': ' + plain(point.value)),
            ),
          ),
        ),
        h(
          'div',
          { className: 'vs-trend-points', 'aria-hidden': 'true' },
          points.map((point, index) =>
            h(
              'div',
              { key: index, className: 'vs-trend-point' },
              h('div', { className: 'vs-trend-value tabular-nums' }, plain(point.value)),
              h('div', { className: 'vs-trend-label' }, plain(point.label)),
            ),
          ),
        ),
        caption
          ? h('figcaption', { className: 'mt-2 text-sm italic text-muted-foreground' }, plain(caption))
          : null,
      ),
    );
  };

  // Chart is the axis chart: several series against shared points, drawn by
  // d3 at view time. The render carries the parsed spec on a data attribute
  // plus text fallback rows; the factory's enhancer (end of file) replaces
  // the fallback with the SVG. Under the CLI's node render only the fallback
  // exists, so the artifact still lints and prints without a network.
  const Chart = ({ body = '', kind = 'line', x = '', y = '', caption = '' }) => {
    const points = String(x)
      .split(',')
      .map((part) => part.trim())
      .filter(Boolean);
    const series = rows(body)
      .map((row) => {
        const { label, value } = labelValue(row);
        return { name: plain(label), values: value.split(',').map((part) => firstNumber(part)) };
      })
      .filter((entry) => entry.name && entry.values.every((v) => Number.isFinite(v)));
    // A malformed spec (missing x, ragged rows, >6 series) keeps the text
    // fallback instead of guessing an alignment the author did not state.
    const valid =
      points.length >= 2 &&
      series.length >= 1 &&
      series.length <= 6 &&
      series.every((entry) => entry.values.length === points.length);
    const unit = plain(y);
    const spec = { kind: kind === 'bar' ? 'bar' : 'line', x: points, y: unit, series, caption: plain(caption) };
    return wrap(
      'Chart',
      h(
        'figure',
        { className: 'vs-chart-figure rounded-lg border bg-card px-4 py-4' },
        h(
          'div',
          valid ? { className: 'vs-chart', 'data-vs-chart': JSON.stringify(spec) } : { className: 'vs-chart' },
          series.length
            ? series.map((entry, index) =>
                h(
                  'div',
                  { key: index, className: 'text-sm' },
                  entry.name + ': ' + entry.values.join(', ') + (unit ? ' ' + unit : ''),
                ),
              )
            : h('div', { className: 'text-sm' }, plain(body)),
        ),
        caption
          ? h('figcaption', { className: 'mt-2 text-sm italic text-muted-foreground' }, plain(caption))
          : null,
      ),
    );
  };

  const NOTE_SPLIT = /\s+(?:—|--)\s+/;

  // Tree shows a hierarchy the way a terminal does - drawn guides, two-space
  // indents - plus diff marks so one tree carries a proposal's before/after
  // layout instead of two panes the reader must diff by eye.
  const TREE_MARKS = { '+': 'add', '−': 'remove', '~': 'change' };
  const TREE_TONE = { add: 'text-emerald-700', remove: 'text-red-700', change: 'text-amber-700' };
  const TREE_GLYPH = { add: '+', remove: '−', change: '~' };
  const treeRows = (body) =>
    String(body)
      .split('\n')
      .map((line) => line.match(/^(\s*)- (.*)$/))
      .filter(Boolean)
      .map((match) => {
        let text = match[2].trim();
        const key = text[0] === '-' ? '−' : text[0];
        const mark = text[1] === ' ' && TREE_MARKS[key] ? TREE_MARKS[key] : null;
        if (mark) text = text.slice(2).trim();
        return { depth: Math.floor(match[1].length / 2), mark, text };
      });
  // A level continues while a later row still sits on it; the guide glyph per
  // level is decided by looking ahead to where the depth next drops below it.
  const treeGuide = (parsed, index) => {
    const depth = parsed[index].depth;
    let guide = '';
    for (let level = 1; level <= depth; level++) {
      let joins = false;
      for (let next = index + 1; next < parsed.length; next++) {
        if (parsed[next].depth < level) break;
        if (parsed[next].depth === level) {
          joins = true;
          break;
        }
      }
      guide += level === depth ? (joins ? '├─ ' : '└─ ') : joins ? '│  ' : '   ';
    }
    return guide;
  };
  const Tree = ({ body = '' }) => {
    const parsed = treeRows(body);
    return wrap(
      'Tree',
      h(
        'div',
        { className: 'vs-tree rounded-lg border bg-card px-4 py-3' },
        parsed.map((row, index) => {
          const { label, value } = labelValue(row.text);
          const guide = treeGuide(parsed, index);
          return h(
            'div',
            { key: index, className: 'vs-tree-row' },
            guide ? h('span', { 'aria-hidden': 'true', className: 'vs-tree-guide' }, guide) : null,
            row.mark ? h('span', { className: 'font-bold ' + TREE_TONE[row.mark] }, TREE_GLYPH[row.mark] + ' ') : null,
            h(
              'span',
              {
                className: row.mark
                  ? TREE_TONE[row.mark] + (row.mark === 'remove' ? ' line-through' : '')
                  : 'text-card-foreground',
              },
              plain(label),
            ),
            value ? h('span', { className: 'vs-tree-note' }, '  — ' + plain(value)) : null,
          );
        }),
      ),
    );
  };

  // Sequence draws who-calls-whom as actor columns and ordered messages, all
  // inline SVG like <Trend> - no library, portable. Height grows one step per
  // message so the diagram scales with the exchange it shows.
  const SEQ_MESSAGE = /^(.+?)\s*(-->|->)\s*(.+?):\s*(.*)$/;
  const Sequence = ({ body = '', caption = '' }) => {
    const messages = rows(body)
      .map((row) => {
        const match = row.match(SEQ_MESSAGE);
        return match
          ? { from: match[1].trim(), to: match[3].trim(), text: match[4].trim(), dashed: match[2] === '-->' }
          : null;
      })
      .filter(Boolean);
    const actors = [];
    for (const message of messages) {
      for (const name of [message.from, message.to]) {
        if (!actors.includes(name)) actors.push(name);
      }
    }
    if (actors.length < 2) {
      return wrap('Sequence', h('div', { className: 'rounded-lg border bg-card px-4 py-3 text-sm' }, plain(body)));
    }
    const WIDTH = 560;
    const SIDE = 70;
    const TOP = 30;
    const STEP = 34;
    const height = TOP + messages.length * STEP + 10;
    const ax = (name) => SIDE + (actors.indexOf(name) * (WIDTH - 2 * SIDE)) / (actors.length - 1);
    return wrap(
      'Sequence',
      h(
        'figure',
        { className: 'vs-seq rounded-lg border bg-card px-4 py-4' },
        h(
          'svg',
          { viewBox: '0 0 ' + WIDTH + ' ' + height, role: 'img', 'aria-label': plain(caption) || 'sequence diagram' },
          actors.map((name) =>
            h(
              'g',
              { key: name },
              h('text', { x: ax(name), y: 12, textAnchor: 'middle', className: 'vs-seq-actor' }, name),
              h('line', {
                x1: ax(name),
                y1: TOP - 10,
                x2: ax(name),
                y2: height - 4,
                className: 'vs-seq-life',
                strokeDasharray: '3 4',
              }),
            ),
          ),
          messages.map((message, index) => {
            const y = TOP + index * STEP + 14;
            const x1 = ax(message.from);
            const x2 = ax(message.to);
            if (message.from === message.to) {
              return h(
                'g',
                { key: index },
                h('path', {
                  d: 'M' + x1 + ' ' + (y - 8) + ' h26 v12 h-20',
                  fill: 'none',
                  stroke: 'currentColor',
                  strokeWidth: 1.5,
                }),
                h('polygon', {
                  points: x1 + 6 + ',' + (y + 4) + ' ' + (x1 + 13) + ',' + y + ' ' + (x1 + 13) + ',' + (y + 8),
                  fill: 'currentColor',
                }),
                h('text', { x: x1 + 32, y: y, className: 'vs-seq-msg' }, plain(message.text)),
              );
            }
            const sign = x2 > x1 ? 1 : -1;
            return h(
              'g',
              { key: index },
              h('line', {
                x1,
                y1: y,
                x2: x2 - 8 * sign,
                y2: y,
                stroke: 'currentColor',
                strokeWidth: 1.5,
                strokeDasharray: message.dashed ? '5 4' : undefined,
              }),
              h('polygon', {
                points: x2 + ',' + y + ' ' + (x2 - 8 * sign) + ',' + (y - 4) + ' ' + (x2 - 8 * sign) + ',' + (y + 4),
                fill: 'currentColor',
              }),
              h('text', { x: (x1 + x2) / 2, y: y - 6, textAnchor: 'middle', className: 'vs-seq-msg' }, plain(message.text)),
            );
          }),
        ),
        caption ? h('figcaption', { className: 'mt-2 text-sm italic text-muted-foreground' }, plain(caption)) : null,
      ),
    );
  };

  // ApiDiff reads like a diff because that is what a consumer scans for: what
  // appeared, what vanished, what moved under them.
  const API_MARKS = { '+': 'add', '−': 'remove', '-': 'remove', '~': 'change' };
  const API_TONE = {
    add: 'bg-emerald-50 text-emerald-700',
    remove: 'bg-red-50 text-red-700',
    change: 'bg-amber-50 text-amber-700',
  };
  const API_GLYPH = { add: '+', remove: '−', change: '~' };
  const ApiDiff = ({ body = '' }) =>
    wrap(
      'ApiDiff',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const mark = row[1] === ' ' ? API_MARKS[row[0]] : undefined;
          const rest = mark ? row.slice(2).trim() : row;
          const [signature, ...noteParts] = rest.split(NOTE_SPLIT);
          return h(
            'div',
            { key: index, className: 'flex flex-wrap items-baseline gap-x-3 gap-y-1 px-4 py-2' },
            h(
              'span',
              {
                'aria-hidden': 'true',
                className: 'inline-flex w-5 justify-center rounded text-xs font-bold ' + (mark ? API_TONE[mark] : 'text-muted-foreground'),
              },
              mark ? API_GLYPH[mark] : '·',
            ),
            h(
              'span',
              {
                className:
                  'font-mono text-sm ' +
                  (mark === 'remove' ? 'text-muted-foreground line-through' : 'text-card-foreground'),
              },
              plain(signature),
            ),
            noteParts.length
              ? h('span', { className: 'text-sm text-muted-foreground' }, plain(noteParts.join(' — ')))
              : null,
          );
        }),
      ),
    );

  // Options closes alternatives; Tradeoff weighs open ones. The chip is the
  // disposition, the reason is the sentence that stops the debate reopening.
  const bracketTag = (text) => {
    const match = text.match(/^\[([a-z]+)\]\s+(.*)$/i);
    return match ? { tag: match[1].toLowerCase(), rest: match[2] } : { rest: text };
  };
  const OPTION_TONE = {
    chosen: 'bg-emerald-50 text-emerald-700',
    rejected: 'bg-red-50 text-red-700',
    deferred: 'bg-amber-50 text-amber-700',
    open: 'bg-muted text-muted-foreground',
  };
  const Options = ({ body = '' }) => {
    const parsed = rows(body).map((row) => {
      const { tag, rest } = bracketTag(row);
      const disposition = OPTION_TONE[tag] ? tag : 'open';
      const { label, value } = labelValue(rest);
      return { disposition, label, value };
    });
    // MADR's above-the-fold rule: the chosen option surfaces first no matter
    // where the author wrote it, so the outcome opens the block.
    const ordered = [
      ...parsed.filter((option) => option.disposition === 'chosen'),
      ...parsed.filter((option) => option.disposition !== 'chosen'),
    ];
    return wrap(
      'Options',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        ordered.map((option, index) =>
          h(
            'div',
            { key: index, className: 'px-4 py-3', 'data-disposition': option.disposition },
            h(
              'div',
              { className: 'flex flex-wrap items-center gap-2' },
              h(
                'span',
                { className: 'rounded-full px-2 py-0.5 text-xs font-semibold ' + OPTION_TONE[option.disposition] },
                option.disposition,
              ),
              h('span', { className: 'text-sm font-semibold text-card-foreground' }, plain(option.label)),
            ),
            option.value ? h('div', { className: 'mt-1 text-sm text-muted-foreground' }, plain(option.value)) : null,
          ),
        ),
      ),
    );
  };

  // Scope renders the exclusions beside the inclusions on purpose: what a
  // proposal deliberately leaves out is where review arguments start.
  const Scope = ({ body = '' }) => {
    const items = rows(body).map((row) => {
      if (row.startsWith('+')) return { inside: true, text: row.slice(1).trim() };
      if (row.startsWith('−') || row.startsWith('-')) return { inside: false, text: row.slice(1).trim() };
      return { inside: true, text: row };
    });
    const column = (title, list, glyph, tone) =>
      h(
        'div',
        { className: 'rounded-lg border bg-card px-4 py-3' },
        h('div', { className: 'text-xs font-semibold tracking-wider text-muted-foreground uppercase' }, title),
        h(
          'ul',
          { className: 'flex flex-col gap-1.5', style: { listStyle: 'none', margin: '8px 0 0', padding: 0 } },
          list.map((item, index) =>
            h(
              'li',
              { key: index, className: 'flex gap-2 text-sm text-card-foreground' },
              h('span', { 'aria-hidden': 'true', className: 'font-bold ' + tone }, glyph),
              h('span', null, plain(item.text)),
            ),
          ),
        ),
      );
    return wrap(
      'Scope',
      h(
        'div',
        { className: 'grid grid-cols-[repeat(auto-fit,minmax(220px,1fr))] gap-3' },
        column('In scope', items.filter((item) => item.inside), '✓', 'text-emerald-700'),
        column('Out of scope', items.filter((item) => !item.inside), '✕', 'text-red-700'),
      ),
    );
  };

  // Risks pairs every worry with its mitigation on one row; the two chips make
  // an unmitigated high × high impossible to bury in prose.
  const RISK_LEVELS = /\b(high|medium|low)\s*[×x]\s*(high|medium|low)\b/i;
  const RISK_TONE = {
    high: 'bg-red-50 text-red-700',
    medium: 'bg-amber-50 text-amber-700',
    low: 'bg-emerald-50 text-emerald-700',
  };
  const Risks = ({ body = '' }) =>
    wrap(
      'Risks',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const { label, value } = labelValue(row);
          const match = value.match(RISK_LEVELS);
          if (!match) {
            return h('div', { key: index, className: 'px-4 py-3 text-sm' }, plain(row));
          }
          const likelihood = match[1].toLowerCase();
          const impact = match[2].toLowerCase();
          const mitigation = value
            .slice(match.index + match[0].length)
            .replace(/^\s*(?:—|--|-)\s*/, '');
          return h(
            'div',
            { key: index, className: 'px-4 py-3' },
            h(
              'div',
              { className: 'flex flex-wrap items-center gap-2' },
              h('span', { className: 'text-sm font-semibold text-card-foreground' }, plain(label)),
              h(
                'span',
                { className: 'rounded px-1.5 py-0.5 text-xs font-semibold ' + RISK_TONE[likelihood] },
                'likelihood ' + likelihood,
              ),
              h(
                'span',
                { className: 'rounded px-1.5 py-0.5 text-xs font-semibold ' + RISK_TONE[impact] },
                'impact ' + impact,
              ),
            ),
            mitigation ? h('div', { className: 'mt-1 text-sm text-muted-foreground' }, plain(mitigation)) : null,
          );
        }),
      ),
    );

  // Impact is the blast-radius ledger: one row per audience, what the change
  // costs them, nothing else.
  const Impact = ({ body = '' }) =>
    wrap(
      'Impact',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const { label, value } = labelValue(row);
          return h(
            'div',
            { key: index, className: 'grid grid-cols-[minmax(120px,180px)_1fr] gap-3 px-4 py-2.5' },
            h('span', { className: 'font-mono text-xs font-bold text-card-foreground' }, plain(label)),
            h('span', { className: 'text-sm text-muted-foreground' }, plain(value)),
          );
        }),
      ),
    );

  // Questions keeps settled rows on the page: the settled-to-open ratio is
  // how a living proposal shows convergence across revisions.
  const QUESTION_TONE = {
    open: 'bg-amber-50 text-amber-700',
    settled: 'bg-emerald-50 text-emerald-700',
  };
  const Questions = ({ body = '' }) =>
    wrap(
      'Questions',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const { tag, rest } = bracketTag(row);
          const status = tag === 'settled' ? 'settled' : 'open';
          const [question, ...ownerParts] = rest.split(NOTE_SPLIT);
          return h(
            'div',
            { key: index, className: 'flex flex-wrap items-baseline gap-x-3 gap-y-1 px-4 py-2.5' },
            h('span', { className: 'rounded-full px-2 py-0.5 text-xs font-semibold ' + QUESTION_TONE[status] }, status),
            h('span', { className: 'text-sm text-card-foreground' }, plain(question)),
            ownerParts.length
              ? h('span', { className: 'font-mono text-xs text-muted-foreground' }, plain(ownerParts.join(' — ')))
              : null,
          );
        }),
      ),
    );

  // Compat is a support matrix, not a data table: the marks are semantic and
  // colored, and anything that is not a mark passes through as text.
  const COMPAT_MARKS = {
    '✓': ['✓', 'text-emerald-700'],
    yes: ['✓', 'text-emerald-700'],
    '✗': ['✗', 'text-red-700'],
    '✕': ['✗', 'text-red-700'],
    no: ['✗', 'text-red-700'],
    partial: ['±', 'text-amber-700'],
    '±': ['±', 'text-amber-700'],
  };
  const Compat = ({ body = '', columns = '' }) => {
    const heads = String(columns)
      .split(',')
      .map((head) => head.trim())
      .filter(Boolean);
    if (!heads.length) {
      return wrap('Compat', h('div', { className: 'rounded-lg border bg-card px-4 py-3 text-sm' }, plain(body)));
    }
    const parsed = rows(body).map((row) => {
      const { label, value } = labelValue(row);
      return { label, cells: value.split(/\s+·\s+/).map((cell) => cell.trim()) };
    });
    return wrap(
      'Compat',
      h(
        'div',
        { className: 'overflow-x-auto rounded-lg border bg-card' },
        h(
          'table',
          { className: 'w-full text-sm', style: { borderCollapse: 'collapse', margin: 0 } },
          h(
            'thead',
            null,
            h(
              'tr',
              null,
              h('th', { className: 'px-3 py-2 text-left text-xs font-semibold text-muted-foreground' }, ''),
              heads.map((head, index) =>
                h(
                  'th',
                  { key: index, className: 'px-3 py-2 text-center text-xs font-semibold text-muted-foreground' },
                  head,
                ),
              ),
            ),
          ),
          h(
            'tbody',
            null,
            parsed.map((row, rowIndex) =>
              h(
                'tr',
                { key: rowIndex, style: { borderTop: '1px solid var(--md-sys-color-outline-variant)' } },
                h('td', { className: 'px-3 py-2 font-medium text-card-foreground' }, plain(row.label)),
                heads.map((head, cellIndex) => {
                  const cell = row.cells[cellIndex] || '';
                  const mark = COMPAT_MARKS[cell.toLowerCase()];
                  return h(
                    'td',
                    {
                      key: cellIndex,
                      className:
                        'px-3 py-2 text-center ' + (mark ? 'font-bold ' + mark[1] : 'text-muted-foreground'),
                    },
                    mark ? mark[0] : plain(cell),
                  );
                }),
              ),
            ),
          ),
        ),
      ),
    );
  };

  // Signoff: the gates between this phase and the next. KEP marks which items
  // are required, TC39 strikes what deliberately does not apply - both
  // survive here so "not done" and "doesn't apply" never read the same.
  const SIGNOFF_BOX = /^\[([ x~])\]\s*(.*)$/i;
  const Signoff = ({ body = '' }) =>
    wrap(
      'Signoff',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const boxMatch = row.match(SIGNOFF_BOX);
          if (!boxMatch) {
            return h('div', { key: index, className: 'px-4 py-2.5 text-sm' }, plain(row));
          }
          const state = boxMatch[1].toLowerCase() === 'x' ? 'done' : boxMatch[1] === '~' ? 'na' : 'pending';
          const required = /^\(R\)\s*/.test(boxMatch[2]);
          const rest = required ? boxMatch[2].replace(/^\(R\)\s*/, '') : boxMatch[2];
          const [item, ...noteParts] = rest.split(NOTE_SPLIT);
          return h(
            'div',
            { key: index, className: 'flex flex-wrap items-baseline gap-x-3 gap-y-1 px-4 py-2.5' },
            h(
              'span',
              {
                'aria-hidden': 'true',
                className:
                  'inline-flex w-5 justify-center rounded text-xs font-bold ' +
                  (state === 'done' ? 'bg-emerald-50 text-emerald-700' : 'text-muted-foreground'),
              },
              // Tilde, not em dash: the dedash pass rewrites — to - in text
              // nodes, which turned "doesn't apply" into a stray minus. ASCII
              // ~ echoes the [~] source syntax and no pass touches it.
              state === 'done' ? '✓' : state === 'na' ? '~' : '○',
            ),
            h(
              'span',
              { className: 'text-sm ' + (state === 'na' ? 'text-muted-foreground line-through' : 'text-card-foreground') },
              plain(item),
            ),
            required
              ? h('span', { className: 'rounded px-1.5 py-0.5 text-xs font-semibold bg-amber-50 text-amber-700' }, 'required')
              : null,
            noteParts.length
              ? h('span', { className: 'text-sm text-muted-foreground' }, plain(noteParts.join(' — ')))
              : null,
          );
        }),
      ),
    );

  // History: dated state transitions with their evidence, oldest first. An
  // "updated" stamp says something changed; this says what, when, and where
  // the decision artifact lives.
  const History = ({ body = '' }) =>
    wrap(
      'History',
      h(
        'div',
        { className: 'divide-y rounded-lg border bg-card' },
        rows(body).map((row, index) => {
          const { label, value } = labelValue(row);
          const [event, ...noteParts] = value.split(NOTE_SPLIT);
          return h(
            'div',
            { key: index, className: 'grid grid-cols-[minmax(96px,112px)_1fr] gap-3 px-4 py-2.5' },
            h('span', { className: 'font-mono text-xs font-bold text-card-foreground' }, plain(label)),
            h(
              'span',
              { className: 'text-sm text-card-foreground' },
              plain(event),
              noteParts.length
                ? h('span', { className: 'text-muted-foreground' }, ' — ' + plain(noteParts.join(' — ')))
                : null,
            ),
          );
        }),
      ),
    );

  // vs-proposal chrome. The hero carries what frontmatter declares - title,
  // eyebrow, owner, phase, updated - and the contents rail is scanned from
  // the mounted h2s, so it can never drift from the document's sections. The
  // scan needs hooks, so a hookless host (the CLI lint path, a stub React)
  // gets the document without the chrome instead of a crash.
  const PROPOSAL_PHASES = ['Draft', 'Proposed', 'Accepted', 'Rejected', 'Superseded'];
  // PEP-style dead-state banners: a closed proposal warns before the lede,
  // not in a chip the reader has to decode.
  const PROPOSAL_NOTICE = {
    Rejected: 'This proposal was rejected. It stays published for the record - do not build on it.',
    Superseded: 'This proposal was superseded. Read the successor in History before acting on anything below.',
  };
  const headingId = (text, index) => {
    const slug = String(text)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
    return slug || 'section-' + (index + 1);
  };
  const ProposalLayout = ({ children, slots = {} }) => {
    const mainRef = React.useRef(null);
    const [contents, setContents] = React.useState([]);

  if (

        // single quotes to double before JSON.parse, corrupting the whole

        noteTextColor: '#D7DCE4',
      },

        // the doc while the catalog module is still loading), and
        // Htmdx.rerender cannot repair them: the reused React root keeps the
        // mermaid effect's deps identical, so it never re-renders. The source
        // script is also detached from the DOM at mount, so fences come back
        // through Htmdx.resolveSource(host), which serves the runtime's own
        // cached copy. Fence order matches .htmdx-mermaid order; any diagram
        // that landed plain re-renders and swaps in place. One-shot per
        // block; the artifact is static after load, so React never
        // reconciles the swap.
        let repairSeq = 0;
        // A pre-wrap render is detected by absence of the directive's
        // fontFamily fingerprint in the svg, not by plain flowchart shapes:
        // sequence and other legacy-renderer diagrams never carry
        // rect.basic.label-container, so a shape check leaves them stuck on
        // mermaid's stock theme. Authored-directive fences are excluded by
        // the per-block source check before any re-render.
        const missedDirective = (block) => {
          const svg = block.querySelector('svg');
          return !!svg && !svg.outerHTML.includes('Excalifont');
        };
        const repaint = () => {
          const blocks = Array.from(document.querySelectorAll('.htmdx-mermaid'));
          const host = blocks[0]?.closest(globalThis.Htmdx.DEFAULT_TAG_NAME);
          if (!host) return;
          if (!blocks.some(missedDirective)) return;
          globalThis.Htmdx.resolveSource(host)
            .then(({ ok, source }) => {
              if (!ok) return;
              const sources = [];
              const fence = /```mermaid[^\S\n]*\n([\s\S]*?)```/g;
              for (let match; (match = fence.exec(source)); ) sources.push(match[1]);
              if (blocks.length !== sources.length) return;
              blocks.forEach((block, index) => {
                if (!missedDirective(block)) return;
                const text = sources[index];
                if (text.includes('%%{init') || text.trimStart().startsWith('---')) return;

                block.setAttribute('data-vs-sketch-repair', 'true');
                repairSeq += 1;
                originalRender(`vs-sketch-repair-${repairSeq}`, sketchDirective + text)
                  .then(({ svg: markup }) => {
                    const current = block.querySelector('svg');
                    if (current) current.outerHTML = markup;

                  .catch(() => {});
              });

            .catch(() => {});
        };

            subtree: true,
          });

      })
      .catch(() => {});
    // Pan/zoom for oversized diagrams. panzoom applies a CSS transform to the
    // svg without restructuring it (unlike svg-pan-zoom's injected viewport
    // <g>), so the sketch repair swap and the palette selectors stay valid.
    // Plain wheel keeps scrolling the page - zoom needs ctrl/cmd. The repair
    // pass replaces svg.outerHTML, orphaning any bound instance, so binding is
    // keyed per block on the current svg node and rebinds after a swap.
    import('https://cdn.jsdelivr.net/npm/panzoom@9.4.4/+esm')
      .then((mod) => {
        const panzoom = mod.default ?? mod;
        const bindings = new WeakMap();
        // panzoom binds its drag listeners to the owner (the svg's parent), so
        // a control sitting inside the panel would start a pan on mousedown.
        const controlBar = (className) => {
          const bar = document.createElement('div');
          bar.className = className;
          bar.addEventListener('mousedown', (event) => event.stopPropagation());
          return bar;
        };
        const button = (className, label, onClick) => {
          const el = document.createElement('button');
          el.type = 'button';
          el.className = className;
          el.title = label;
          el.setAttribute('aria-label', label);
          el.addEventListener('click', onClick);
          return el;
        };
        // Buttons zoom around the panel's midpoint - panzoom's zoom origin is
        // owner-relative, matching what the wheel handler feeds it.
        const zoomButtons = (bar, getPan, getOwner) => {
          const step = (ratio) => () => {
            const pan = getPan();
            const owner = getOwner();
            if (!pan || !owner) return;
            const rect = owner.getBoundingClientRect();
            pan.smoothZoom(rect.width / 2, rect.height / 2, ratio);
          };
          const out = button('vs-mermaid-zoom', 'Zoom out', step(1 / 1.4));
          out.textContent = '−';
          const into = button('vs-mermaid-zoom', 'Zoom in', step(1.4));
          into.textContent = '+';
          bar.append(out, into);
        };
        const expandIcon = () =>
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M6 2H2v4M10 2h4v4M10 14h4v-4M6 14H2v-4"/></svg>';
        // Full view: one lazily created native <dialog> shared by all blocks.
        // The current svg is cloned into it (transform cleared), so the inline
        // canvas keeps its own pan state; inside the modal plain wheel zooms
        // because there is no page scroll to protect. Esc and the close
        // button both land in the close event, which disposes the clone.
        let dialog = null;
        let dialogCanvas = null;
        let dialogPan = null;
        const openDialog = (block) => {
          const svg = block.querySelector('svg');
          if (!svg) return;
          if (!dialog) {
            dialog = document.createElement('dialog');
            dialog.className = 'vs-mermaid-dialog';
            dialog.setAttribute('aria-label', 'Diagram full view');
            dialogCanvas = document.createElement('div');
            dialogCanvas.className = 'vs-mermaid-dialog-canvas';
            const bar = controlBar('vs-mermaid-dialog-controls');
            zoomButtons(
              bar,
              () => dialogPan,
              () => dialogCanvas,
            );
            const close = button('vs-mermaid-dialog-close', 'Close', () => dialog.close());
            close.textContent = 'Close';
            bar.appendChild(close);
            dialog.append(dialogCanvas, bar);
            dialog.addEventListener('close', () => {
              dialogPan?.dispose();
              dialogPan = null;
              dialogCanvas.textContent = '';
            });

          }

          clone.style.transform = '';
          clone.style.maxWidth = 'none';
          dialogCanvas.appendChild(clone);
          dialog.showModal();
          dialogPan = panzoom(clone, {
            maxZoom: 12,
            minZoom: 0.1,
            smoothScroll: false,
            zoomDoubleClickSpeed: 1,
          });
          // panzoom's autocenter never rescales, so a width-100% clone opens
          // anchored top-left. Fit-and-center by hand: measure at identity,
          // scale to the canvas with a margin, translate to the middle.
          const fit = () => {
            dialogPan.zoomAbs(0, 0, 1);
            dialogPan.moveTo(0, 0);
            const canvasRect = dialogCanvas.getBoundingClientRect();
            const rect = clone.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const scale = Math.min(
              (canvasRect.width / rect.width) * 0.92,
              (canvasRect.height / rect.height) * 0.92,
              1,
            );
            dialogPan.zoomAbs(0, 0, scale);
            dialogPan.moveTo(
              (canvasRect.width - rect.width * scale) / 2,
              (canvasRect.height - rect.height * scale) / 2,
            );

          document.querySelectorAll('.htmdx-mermaid').forEach((block) => {
