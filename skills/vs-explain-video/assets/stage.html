<!doctype html>
<!--
  Explain-video stage. init.mjs copies this to index.html; do not edit it per
  video. Scenes go in scenes.js, words and timing come from timeline.js
  (narrate.mjs), motion helpers from motion.js. 1920x1080, seeked per frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Grotesk; src: url(fonts/SpaceGrotesk.ttf); font-weight: 300 700; }
@font-face { font-family: Mono; src: url(fonts/JetBrainsMono.ttf); font-weight: 100 800; }
:root {
  /* One meaning per color for the whole video: acc = the subject/change,
     bad = the problem or cost, ok = the fix or success. Everything else is ink. */
  --bg: #0b0d11; --ink: #f0eadf; --mute: #7f8590; --line: #262c37;
  --card: #12161d; --card2: #181d26;
  --acc: #ffb547; --bad: #ff6b5b; --ok: #7ad58f;
  --sans: Grotesk, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --mono: Mono, "SF Mono", Menlo, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink); font-family: var(--sans); }
#grid { position: absolute; inset: 0; background-image: radial-gradient(#ffffff10 1.2px, transparent 1.2px); background-size: 44px 44px; }
#glow { position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(closest-side, #ffb54716, transparent); }
.scene { position: absolute; inset: 0; }
.abs { position: absolute; }
svg.ov { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
svg.defs { position: absolute; width: 0; height: 0; }

/* type scale: nothing on screen below 20px; body copy 26-34px */
.h1 { font-weight: 700; font-size: 120px; letter-spacing: -.03em; line-height: 1.02; }
.h2 { font-weight: 700; font-size: 72px; letter-spacing: -.02em; line-height: 1.05; }
.h3 { font-weight: 600; font-size: 40px; line-height: 1.15; }
.body { font-size: 30px; line-height: 1.4; }
.lbl { font: 600 18px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.mono { font-family: var(--mono); }
.mute { color: var(--mute); } .acc { color: var(--acc); } .bad { color: var(--bad); } .ok { color: var(--ok); }
.strike { text-decoration: line-through; text-decoration-thickness: 3px; }

/* blocks */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; }
.card.on { border-color: var(--acc); box-shadow: 0 0 32px #ffb54722; }
.pad { padding: 28px 32px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card2); font: 500 21px var(--mono); white-space: nowrap; }
.chip.acc { border-color: var(--acc); color: var(--acc); background: #251f15; }
.chip.bad { border-color: var(--bad); color: var(--bad); background: #261718; }
.chip.ok { border-color: var(--ok); color: var(--ok); background: #16241a; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; background: var(--card2); border: 1.5px solid var(--line); font-size: 27px; font-weight: 600; }
.file { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card2); font: 500 20px var(--mono); white-space: nowrap; }
.file::before { content: ""; width: 14px; height: 18px; border: 2px solid var(--mute); border-radius: 3px; }
.pkg { width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--acc); position: relative; }
.pkg::after { content: ""; position: absolute; left: 8px; right: 8px; top: 17px; height: 5px; background: var(--bg); border-radius: 3px; }
.ver { font: 600 22px var(--mono); padding: 4px 12px; border-radius: 8px; background: #ffffff10; display: inline-block; }
.glyph { width: 34px; height: 34px; flex: none; border-radius: 9px; border: 2px solid var(--ink); display: grid; place-items: center; font: 700 16px var(--mono); }
.head-row { display: flex; align-items: center; gap: 14px; padding: 20px 26px; border-bottom: 1.5px solid var(--line); font-size: 32px; font-weight: 600; }
.head-row .meta { margin-left: auto; font: 500 19px var(--mono); color: var(--mute); }
.term .bar { height: 44px; border-bottom: 1.5px solid var(--line); display: flex; align-items: center; gap: 9px; padding: 0 20px; }
.term .bar i { width: 12px; height: 12px; border-radius: 50%; background: #2b313c; display: block; }
.term .bar span { margin-left: 12px; font: 500 17px var(--mono); color: var(--mute); }
.term .body { padding: 22px 28px; font: 500 30px/1.5 var(--mono); white-space: pre; }
.caret { display: inline-block; width: 15px; height: 30px; background: var(--acc); vertical-align: -5px; margin-left: 2px; }

/* svg strokes */
path.ln { fill: none; stroke: #3a4250; stroke-width: 3; }
path.ln.acc { stroke: var(--acc); } path.ln.bad { stroke: var(--bad); } path.ln.ok { stroke: var(--ok); }
path.ln.dash { stroke-dasharray: 12 11; }
path.head { fill: #3a4250; } path.head.acc { fill: var(--acc); } path.head.bad { fill: var(--bad); } path.head.ok { fill: var(--ok); }

/* chrome: brand, chapter, progress, subtitles */
#progress { position: absolute; left: 0; top: 0; height: 5px; background: var(--acc); }
#brand { position: absolute; left: 64px; top: 38px; font: 500 20px var(--mono); color: var(--mute); }
#chap { position: absolute; right: 64px; top: 38px; font: 500 20px var(--mono); color: var(--mute); text-align: right; }
#chap b { color: var(--ink); font-weight: 600; }
#sub { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; pointer-events: none; }
#sub span { display: inline-block; max-width: 1500px; padding: 12px 26px; border-radius: 12px; background: #000000c0; font: 500 38px/1.3 var(--sans); color: #fff; }
#sub span:empty { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div><div id="glow"></div>
  <div id="scenes"></div>
  <div id="progress"></div><div id="brand"></div><div id="chap"></div>
  <div id="sub"><span></span></div>
</div>
<script src="timeline.js"></script>
<script src="motion.js"></script>
<script src="scenes.js"></script>
<script>VS.boot();</script>
</body>
</html>
