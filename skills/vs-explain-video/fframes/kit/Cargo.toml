# vs explain-video kit for fframes: the stage (dot field, scene handoffs, chrome,
# Pill word captions) and the motion helpers, so a video crate only writes its
# scenes. Built once per machine into the shared target dir (fframes.mjs doctor).
[package]
name = "vs_fframes_kit"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli", "h264", "libav-agree-gpl"] }
serde_json = "1"

# Skia on the CPU renders every frame by default; no GPU is needed. The GPU
# backend (Metal on macOS, Vulkan elsewhere) is compiled in only because each
# feature set matches a prebuilt Skia binary rust-skia publishes
# (ganesh-...-metal-... and ganesh-...-vulkan-...), so Skia never builds from source.
[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { version = "=1.3.0", features = ["metal", "cli"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { version = "=1.3.0", features = ["vulkan", "cli"] }
